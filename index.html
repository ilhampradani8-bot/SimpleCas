<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SimpelKas Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans select-none pb-32">

    <div id="view-login" class="min-h-screen flex flex-col justify-center px-6 bg-white z-[100] fixed inset-0">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-blue-600">SimpelKas</h1>
            <p class="text-gray-400 text-sm">Kelola jualan jadi lebih profesional</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200">Masuk / Daftar</button>
        </div>
    </div>

    <div id="view-app" class="hidden min-h-screen flex flex-col">
        
        <header class="bg-blue-600 text-white p-6 rounded-b-[2.5rem] shadow-lg sticky top-0 z-30">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 id="nama-toko-display" class="font-bold text-lg">Toko Saya</h2>
                    <p class="text-blue-100 text-[10px]">Dashboard Kasir</p>
                </div>
                <button onclick="logout()" class="p-2 bg-blue-500 rounded-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-2">
                <div class="bg-blue-500 p-4 rounded-2xl">
                    <p class="text-[10px] text-blue-100">Omzet Hari Ini</p>
                    <p id="total-omzet" class="font-bold text-lg">Rp 0</p>
                </div>
                <div class="bg-blue-500 p-4 rounded-2xl text-right">
                    <p class="text-[10px] text-blue-100">Terjual</p>
                    <p id="total-trx" class="font-bold text-lg">0</p>
                </div>
            </div>
        </header>

        <main id="tab-kasir" class="px-5 mt-6 pb-20">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800">📦 Katalog Produk</h3>
                <button onclick="tambahProduk()" class="bg-blue-600 text-white p-2 rounded-xl shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>
            <div id="list-produk" class="space-y-3">
                </div>
        </main>

        <main id="tab-akun" class="hidden px-5 mt-6 pb-20">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                <h3 class="font-bold text-gray-800 mb-3 text-sm">📋 Riwayat Jualan Terbaru</h3>
                <div id="list-riwayat" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-bold text-gray-800 mb-4 text-sm">⚙️ Pengaturan Toko & Chat WA</h3>
                <div class="space-y-3">
                    <input type="text" id="input-toko" placeholder="Nama Toko" class="w-full p-3 bg-gray-50 rounded-lg text-sm outline-none">
                    <input type="text" id="input-bank" placeholder="Nama Bank (BCA/Mandiri)" class="w-full p-3 bg-gray-50 rounded-lg text-sm outline-none">
                    <input type="text" id="input-norek" placeholder="Nomor Rekening" class="w-full p-3 bg-gray-50 rounded-lg text-sm outline-none">
                    <textarea id="input-footer" placeholder="Pesan Penutup (Contoh: Terima Kasih)" class="w-full p-3 bg-gray-50 rounded-lg text-sm outline-none h-20"></textarea>
                    <button onclick="simpanPengaturan()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Simpan Perubahan</button>
                    <button onclick="resetOmzet()" class="w-full mt-8 text-red-500 text-xs font-medium border border-red-200 py-2 rounded-xl hover:bg-red-50 transition">
                 🗑️ Reset Riwayat & Omzet
                  </button>
                </div>
            </div>
            <button onclick="kontakWA()" class="w-full mt-4 bg-green-500 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                Hubungi Admin (Beli Premium)
            </button>
        </main>

        <div id="cart-preview" class="hidden fixed bottom-24 left-4 right-4 bg-white shadow-2xl rounded-2xl border border-blue-100 p-4 z-40">
            <div class="flex justify-between items-center mb-3 text-xs">
                <h4 class="font-bold text-blue-600">🛒 Keranjang</h4>
                <button onclick="kosongkanKeranjang()" class="text-red-400">Kosongkan</button>
            </div>
            <div id="list-item-keranjang" class="space-y-2 max-h-32 overflow-y-auto mb-3 border-b pb-3"></div>
            <div class="flex justify-between items-center">
                <p id="total-tagihan-keranjang" class="font-bold text-lg text-gray-800">Rp 0</p>
                <button onclick="prosesCheckout()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold text-sm">Checkout WA</button>
            </div>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around items-center h-20 z-50 pb-safe">
            <button onclick="bukaTab('kasir')" id="nav-kasir" class="flex flex-col items-center gap-1 text-blue-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span class="text-[10px] font-bold">Kasir</span>
            </button>
            <button onclick="bukaTab('akun')" id="nav-akun" class="flex flex-col items-center gap-1 text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                <span class="text-[10px] font-bold">Pengaturan</span>
            </button>
        </nav>
    </div>

    <script src="main.js"></script>
</body>
</html>
